<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#111827"/>
  <text x="90" y="110" fill="#f9fafb" font-size="52" font-family="Segoe UI, Arial">AI Agent 落地路线图（两周最小版本）</text>
  <rect x="120" y="180" width="640" height="620" rx="20" fill="#1f2937" stroke="#374151" stroke-width="3"/>
  <rect x="840" y="180" width="640" height="620" rx="20" fill="#1f2937" stroke="#374151" stroke-width="3"/>
  <text x="180" y="260" fill="#93c5fd" font-size="42" font-family="Segoe UI, Arial">第 1 周：稳定闭环</text>
  <text x="180" y="340" fill="#e5e7eb" font-size="30" font-family="Segoe UI, Arial">1. 输入需求</text>
  <text x="180" y="390" fill="#e5e7eb" font-size="30" font-family="Segoe UI, Arial">2. 搜索代码</text>
  <text x="180" y="440" fill="#e5e7eb" font-size="30" font-family="Segoe UI, Arial">3. 生成修改建议</text>
  <text x="180" y="490" fill="#e5e7eb" font-size="30" font-family="Segoe UI, Arial">4. 人工确认后执行</text>
  <text x="180" y="540" fill="#e5e7eb" font-size="30" font-family="Segoe UI, Arial">5. 自动生成提交说明</text>
  <text x="900" y="260" fill="#86efac" font-size="42" font-family="Segoe UI, Arial">第 2 周：补关键能力</text>
  <text x="900" y="340" fill="#e5e7eb" font-size="30" font-family="Segoe UI, Arial">1. 权限分级：deny / ask / allow</text>
  <text x="900" y="390" fill="#e5e7eb" font-size="30" font-family="Segoe UI, Arial">2. 上下文压缩：按任务分片</text>
  <text x="900" y="440" fill="#e5e7eb" font-size="30" font-family="Segoe UI, Arial">3. 失败恢复：checkpoint / resume</text>
  <text x="900" y="520" fill="#fef3c7" font-size="28" font-family="Segoe UI, Arial">目标：从“能演示”走向“可持续交付”</text>
</svg>
